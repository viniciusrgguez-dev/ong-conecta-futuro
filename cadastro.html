<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">

        <title>Inclusão Digital/Cadastro</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Faça parte do nosso time!</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="projetos.html">Projetos</a></li>
                    <li><a href="cadastro.html">Seja Voluntário</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section>
                <h2>Formulário de Inscrição</h2>
                <form action="#" method="post">
                     <fieldset>
        <legend>Dados Pessoais</legend>
        
        <div>
            <label for="nome">Nome Completo:</label><br>
            <input type="text" id="nome" name="nome" required>
        </div><br>

        <div>
            <label for="cpf">CPF (11 dígitos):</label><br>
            <input type="text" id="cpf" name="cpf" pattern="\d{11}" placeholder="12345678900" required>
        </div><br>

        <div>
            <label for="telefone">Telefone:</label><br>
            <input type="tel" id="telefone" name="telefone" required>
        </div><br>

        <div>
            <label for="cep">CEP:</label><br>
            <input type="text" id="cep" name="cep" required>
        </div>
    </fieldset><br>

    <button type="submit">Enviar Cadastro</button>
</form>
            </section>
        </main>

        </footer>
    </body>
</html>
